  </defs>
  <rect width="100" height="100" rx="24" fill="#090611" stroke="#9333ea" stroke-width="2.5" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="50" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="url(#violetGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="1">AS</text>
  <circle cx="76" cy="24" r="4" fill="#38bdf8" />
